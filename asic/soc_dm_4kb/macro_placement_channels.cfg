# Twelve macros, 4 KiB caches. Instance names from the real netlist.
#
# This replaces a placement whose macro rows were packed against each other and
# against the die edge. Measured from the LEFs, both SRAM macros put almost all
# of their signal pins on the horizontal edges:
#
#                       pins in bottom 20 um   pins in top 20 um
#   2 KiB (H 416.54)            72                    35
#   1 KiB (H 397.5)             74                    35
#
# Every one of those pins has to escape vertically, so the gap above and below
# each row is the resource that matters. In the previous placement those gaps
# were:
#
#   core bottom (12) -> row1 (30)        18.0 um    216 pins
#   row1 top (446.5) -> row2 (480)       33.5 um    401 pins
#   row3 top (2846.5) -> core top (2888) 41.5 um    175 pins
#   row2 top (877.5) -> row3 (2430)    1552.5 um      0 pins
#
# 33.5 um is 49 met3 tracks (pitch 0.68) for 401 pins. All the free area sat in
# the one channel with nothing to carry. Enlarging the die from 2400 to 2900
# added its 500 um to that same empty band, which is why the enlargement changed
# nothing that mattered.
#
# Here the free 1645.4 um is split across all four channels instead:
#
#   below row1  300.0 um     row1 -> row2  450.0 um
#   row2 -> row3 450.0 um    above row3    445.4 um
#
# The worst channel goes from 49 to 661 met3 tracks for its 401 pins. Die,
# core, macro set and macro columns are unchanged; only the row y coordinates
# move.
u_soc.u_axi_ram.g_bank[0].u_bank                                     30.0    312.0   N
u_soc.u_axi_ram.g_bank[1].u_bank                                    750.0    312.0   N
u_soc.u_axi_ram.g_bank[2].u_bank                                   1470.0    312.0   N
