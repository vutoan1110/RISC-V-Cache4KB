# Twelve macros, 4 KiB caches. Instance names from the real netlist.
#
# Die 2800 x 2900. Raised from 2400 because global routing, not placement, is
# what binds. Measured GRT-0053 resource analysis, 4 KiB against the 1 KiB build
# that routed cleanly:
#
#            1 KiB derated      4 KiB derated
#   met1        814,053            811,749
#   met2        839,766            815,128
#   met3        581,609            568,009
#
# Near-identical CAPACITY, but 12 macros to connect instead of 4 -- the eight
# cache banks add roughly 512 data wires that must cross the same free band.
# The 4 KiB die was already 29 % larger, and every one of those microns was
# macro, so derating absorbed all of it.
#
# The 500 um added here is ALL free area: the band goes 1052 -> 1552 um. Cell
# density was never the problem (28 %); track count was.
