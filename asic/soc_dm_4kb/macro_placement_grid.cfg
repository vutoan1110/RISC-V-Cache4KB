# Twelve macros, 4 KiB caches, arranged so vertical routing can cross.
#
# Measured, not guessed. Both SRAM macros obstruct met1, met2, met3 and met4
# over 96-99 % of their area; only met5 is free above a macro, and met5 is a
# horizontal layer. met2 and met4 are the vertical layers, so NOTHING can route
# vertically through a macro. Every vertical wire has to use the gap between
# macros in a row.
#
# In the previous placement those gaps were 10.2 um in two of the three rows --
# about 22 met2 tracks -- and row 3 put five macros across the die, 2670 um of
# macro in a 2776 um core. The congestion report from a -allow_congestion run
# says exactly that:
#
#   vertical congestion   10,535 of 11,438 violations (92 %)
#   met2                   9,159 of 11,661 overflow   (79 %)
#   y 2000-2500 (row 3)    61.9 % of violations
#   y 1100-1600 (row 2)    31.0 %
#   overall usage          33.86 %  -- the design is not globally congested
#
# Four rows of three replace three rows of 3/4/5. Same twelve macros, same die,
# same core. Gaps within a row go from 10.2 um to 181-334 um.
