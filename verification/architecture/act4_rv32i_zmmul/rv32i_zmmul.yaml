# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json
---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: rv32i-zmmul
description: >-
  Reduced RV32 core. Only the unprivileged RV32I and Zmmul tests are
  in verification scope. ACT4/UDB 0.1.16 makes MXLEN a parameter of Sm and
  ACT4 reads MXLEN unconditionally, so the Sm entry below is a schema shim,
  not a claim that the RTL implements the complete privileged architecture.
  test_config.yaml excludes every privileged test and rvmodel_macros.h does
  not define STANDARD_SM_SUPPORTED.
implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: Zmmul, version: "= 1.0.0" }
  - { name: Sm, version: "= 1.12.0" }

params:
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32
  M_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: false

  TRAP_ON_ECALL_FROM_M: false
  TRAP_ON_EBREAK: false
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: false
  TRAP_ON_RESERVED_INSTRUCTION: false
  TRAP_ON_UNIMPLEMENTED_CSR: false
  TRAP_ON_ILLEGAL_WLRL: false

  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: false
  MTVAL_WIDTH: 32

  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: low

  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  MTVEC_MODES: [0]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVEC_BASE_ALIGNMENT_DIRECT: 4

  PRECISE_SYNCHRONOUS_EXCEPTIONS: false
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  PMA_GRANULARITY: 2
  CONFIG_PTR_ADDRESS: 0

  HPM_COUNTER_EN:
    [false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false]
  MCOUNTINHIBIT_IMPLEMENTED: false
  NUM_PMP_ENTRIES: 0
  MCOUNTENABLE_EN:
    [false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false,
     false, false, false, false, false, false, false, false]
